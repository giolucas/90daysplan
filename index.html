const pad2 = n => (n<10?"0":"")+n;
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fmtDate = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"}); };
const lsGet = (k,f) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):f; } catch { return f; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };
const weekDates = () => { const n=new Date(); const mon=new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7)); return Array.from({length:7},(_,i)=>dateKey(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i))); };

function App() {
  const [tab, setTab] = React.useState(()=>location.hash==="#treino"?"treino":"cardapio");
  const [day, setDay] = React.useState(0);
  const [exMeal, setExMeal] = React.useState(null);
  const [sel, setSel] = React.useState("bracos");
  const [open, setOpen] = React.useState(null);
  const today = dateKey(new Date());
  const [checks, setChecks] = React.useState(()=>Object.fromEntries(Object.entries(TREINOS).map(([k,t])=>[k,lsGet(`${t.key}:dia:${today}`,{})])));
  const [hist, setHist] = React.useState(()=>Object.fromEntries(Object.entries(TREINOS).map(([k,t])=>[k,lsGet(`${t.key}:historico`,[])])));
  const [toast, setToast] = React.useState(false);

  const labels = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  const menu = weekMenu[day];

  const week = weekDates();
  const doneOn = k => Object.values(hist).filter(h=>h.includes(k)).length;
  const weekCount = week.reduce((n,k)=>n+doneOn(k),0);

  const celebrate = () => { setToast(true); setTimeout(()=>setToast(false),2500); };

  const saveWorkout = (w, next) => {
    const t=TREINOS[w];
    const complete=t.items.length>0&&t.items.every(it=>next[it.id]);
    const was=hist[w].includes(today);
    const h=hist[w].filter(d=>d!==today); if(complete) h.push(today); h.sort();
    lsSet(`${t.key}:dia:${today}`,next); lsSet(`${t.key}:historico`,h);
    setChecks({...checks,[w]:next}); setHist({...hist,[w]:h});
    if(complete&&!was) celebrate();
  };
  const toggleItem = (w,id) => { const n={...checks[w]}; if(n[id]) delete n[id]; else n[id]=true; saveWorkout(w,n); };
  const toggleAll = w => {
    const t=TREINOS[w], all=t.items.every(it=>checks[w][it.id]), n={};
    if(!all) t.items.forEach(it=>{n[it.id]=true;});
    saveWorkout(w,n);
  };

  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'Segoe UI',system-ui,sans-serif",maxWidth:480,margin:"0 auto",paddingBottom:80,position:"relative"}}>

      <div style={{display:"flex",background:C.card,margin:"12px 16px",borderRadius:10,border:`1px solid ${C.border}`,overflow:"hidden"}}>
        {[{k:"cardapio",l:"🥗 Cardápio"},{k:"treino",l:"💪 Treino"},{k:"dicas",l:"⭐ Dicas"}].map(t=>(
          <button key={t.k} onClick={()=>setTab(t.k)} style={{flex:1,padding:"10px 6px",background:tab===t.k?C.accent:"transparent",color:tab===t.k?"#fff":C.muted,border:"none",cursor:"pointer",fontWeight:tab===t.k?700:400,fontSize:12}}>
            {t.l}
          </button>
        ))}
      </div>

      {/* Day selector */}
      {tab==="cardapio"&&(
        <div style={{display:"flex",gap:6,padding:"0 16px 12px",overflowX:"auto",scrollbarWidth:"none"}}>
          {labels.map((d,i)=>(
            <button key={d} onClick={()=>{setDay(i);setExMeal(null);}} style={{flexShrink:0,padding:"6px 12px",borderRadius:20,border:`1px solid ${day===i?C.accent:C.border}`,background:day===i?C.accent:C.card,color:day===i?"#fff":C.muted,fontSize:12,fontWeight:600,cursor:"pointer"}}>
              {d}
            </button>
          ))}
        </div>
      )}

      {/* CARDÁPIO */}
      {tab==="cardapio"&&(
        <div style={{padding:"0 16px"}}>
          <div style={{fontSize:13,fontWeight:700,color:C.muted,marginBottom:10,textTransform:"uppercase",letterSpacing:1}}>{menu.day} — {menu.meals.length} refeições</div>
          {menu.meals.map((meal,i)=>(
            <div key={i} onClick={()=>setExMeal(exMeal===i?null:i)} style={{background:C.card,border:`1px solid ${exMeal===i?C.accent:C.border}`,borderRadius:12,marginBottom:8,overflow:"hidden",cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{background:exMeal===i?C.accent:"#2a2d3a",borderRadius:6,padding:"3px 7px",fontSize:11,fontWeight:600,color:exMeal===i?"#fff":C.dim}}>{meal.time}</div>
                  <div style={{fontWeight:600,fontSize:14}}>{meal.name}</div>
                </div>
                <div style={{color:C.dim}}>{exMeal===i?"▲":"▼"}</div>
              </div>
              {exMeal===i&&(
                <div style={{padding:"0 14px 12px",borderTop:`1px solid ${C.border}`}}>
                  {meal.items.map((item,j)=>(
                    <div key={j} style={{display:"flex",gap:8,padding:"6px 0",borderBottom:j<meal.items.length-1?`1px solid ${C.border}`:"none"}}>
                      <span style={{color:C.accent,fontSize:12,marginTop:2}}>●</span>
                      <span style={{fontSize:13}}>{item}</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          ))}
          {day===5&&(
            <div style={{background:"#1a1d27",border:`1px solid ${C.accent}44`,borderRadius:10,padding:12}}>
              <div style={{color:C.accent,fontWeight:700,fontSize:12,marginBottom:4}}>⭐ REFEED SEMANAL</div>
              <div style={{color:C.muted,fontSize:12,lineHeight:1.6}}>Sábado é seu dia de maior flexibilidade. Uma refeição livre ajuda na adesão e pode auxiliar na regulação hormonal (leptina). Não precisa ser perfeito, mas evite exageros.</div>
            </div>
          )}
        </div>
      )}

      {/* TREINO */}
      {tab==="treino"&&(()=>{
        const t=TREINOS[sel], c=checks[sel], total=t.items.length;
        const done=t.items.filter(it=>c[it.id]).length, complete=total>0&&done===total;
        const past=hist[sel].filter(d=>d!==today);
        return (
        <div style={{padding:"0 16px"}}>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            {Object.entries(TREINOS).map(([k,w])=>{
              const on=sel===k, dn=hist[k].includes(today);
              return(
                <button key={k} onClick={()=>{setSel(k);setOpen(null);}} style={{flex:1,padding:"10px 8px",borderRadius:10,border:`1px solid ${on?C.accent:dn?C.green:C.border}`,background:on?C.accent:dn?C.green+"22":C.card,color:on?"#fff":dn?C.green:C.muted,fontWeight:700,fontSize:13,cursor:"pointer"}}>
                  {dn&&"✓ "}{w.emoji} {w.nome}
                </button>
              );
            })}
          </div>

          {total===0?(
            <div style={{background:C.card,border:`1px dashed ${C.border}`,borderRadius:12,padding:"28px 16px",textAlign:"center"}}>
              <div style={{fontSize:28,marginBottom:8}}>{t.emoji}</div>
              <div style={{fontWeight:700,fontSize:14}}>Treino de {t.nome.toLowerCase()} ainda sem exercícios</div>
              <div style={{color:C.muted,fontSize:12,marginTop:4}}>Os exercícios entram aqui assim que forem definidos.</div>
            </div>
          ):(
          <>
          <div style={{background:C.card,border:`1px solid ${complete?C.green+"55":C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
              <div>
                <div style={{color:C.accent,fontWeight:800,fontSize:15}}>{t.nome.toUpperCase()}</div>
                <div style={{color:C.muted,fontSize:12,marginTop:2}}>Hoje · {fmtDate(today)} · {t.sub}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                <div style={{background:complete?C.green+"22":C.card,border:`1.5px solid ${complete?C.green:C.accent}`,borderRadius:10,padding:"4px 12px",minWidth:56,textAlign:"center"}}>
                  <span style={{color:complete?C.green:C.accent,fontWeight:800,fontSize:18}}>{done}</span>
                  <span style={{color:C.dim,fontSize:14}}>/{total}</span>
                </div>
                <div style={{color:C.dim,fontSize:10}}>itens</div>
              </div>
            </div>
            <div style={{background:"#2a2d3a",borderRadius:6,height:6,overflow:"hidden",marginBottom:10}}>
              <div style={{background:complete?C.green:C.accent,height:"100%",borderRadius:6,width:`${done/total*100}%`,transition:"width 0.3s ease"}}/>
            </div>
            <button onClick={()=>toggleAll(sel)} style={{width:"100%",padding:"8px",borderRadius:8,border:`1.5px solid ${complete?C.green:C.accent}`,background:complete?C.green+"22":"transparent",color:complete?C.green:C.accent,fontWeight:700,fontSize:13,cursor:"pointer"}}>
              {complete?"✓ Treino de hoje concluído — desfazer":"Marcar treino como concluído"}
            </button>
            {hist[sel].length>0&&(
              <div style={{color:C.dim,fontSize:11,textAlign:"center",marginTop:8}}>
                {[past.length>0&&`Último antes de hoje: ${fmtDate(past[past.length-1])}`,`${hist[sel].length} ${hist[sel].length===1?"treino concluído":"treinos concluídos"}`].filter(Boolean).join(" · ")}
              </div>
            )}
          </div>

          {t.items.map(it=>{
            const dn=!!c[it.id], isEx=!!it.n, isOpen=open===it.id;
            const gc=it.t==="p"?C.purple:C.green;
            const toggleOpen=()=>{ if(isEx) setOpen(isOpen?null:it.id); };
            return(
              <div key={it.id} style={{background:C.card,border:`1px solid ${isOpen?gc:dn?C.green+"55":C.border}`,borderRadius:10,marginBottom:8,overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",padding:"10px 12px",gap:10}}>
                  <button role="checkbox" aria-checked={dn} aria-label={`Feito: ${it.name}`} onClick={()=>toggleItem(sel,it.id)} style={{flexShrink:0,width:26,height:26,borderRadius:7,border:`2px solid ${dn?C.green:C.dim}`,background:dn?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",padding:0,transition:"all 0.15s"}}>
                    {dn&&<span style={{color:"#fff",fontSize:14,lineHeight:1}}>✓</span>}
                  </button>
                  <div onClick={toggleOpen} style={{flexShrink:0,width:36,height:36,borderRadius:"50%",background:isEx?gc+"22":"#2a2d3a",color:isEx?gc:C.text,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:isEx?15:18,opacity:dn?0.5:1,cursor:isEx?"pointer":"default"}}>
                    {isEx?it.n:it.emoji}
                  </div>
                  <div onClick={toggleOpen} style={{flex:1,minWidth:0,cursor:isEx?"pointer":"default"}}>
                    <div style={{fontWeight:600,fontSize:14,color:dn?C.dim:C.text,textDecoration:dn?"line-through":"none",lineHeight:1.3}}>{it.name}</div>
                    <div style={{color:C.muted,fontSize:12,marginTop:3}}>{it.meta}</div>
                  </div>
                  {isEx&&(
                    <button onClick={toggleOpen} aria-expanded={isOpen} aria-label={isOpen?"Fechar ficha":"Ver máquina e execução"} style={{flexShrink:0,background:"none",border:"none",color:C.dim,fontSize:13,cursor:"pointer",padding:6}}>
                      {isOpen?"▲":"▼"}
                    </button>
                  )}
                </div>
                {isOpen&&(
                  <div className={`t-${it.t}`} style={{padding:"4px 14px 14px",borderTop:`1px solid ${C.border}`}}>
                    <div dangerouslySetInnerHTML={{__html:DRAW[it.draw].split("url(#ah)").join(`url(#ah-${it.t})`)}}/>
                    <div style={{color:gc,fontSize:11,fontWeight:700,letterSpacing:1,marginTop:8}}>AJUSTE</div>
                    <div style={{fontSize:13,lineHeight:1.5,marginTop:3}}>{it.setup}</div>
                    <div style={{color:gc,fontSize:11,fontWeight:700,letterSpacing:1,marginTop:10}}>COMO FAZER</div>
                    <ol style={{paddingLeft:18,marginTop:3}}>
                      {it.steps.map((st,k)=><li key={k} style={{fontSize:13,lineHeight:1.5,marginBottom:2}}>{st}</li>)}
                    </ol>
                    <div style={{color:gc,fontSize:11,fontWeight:700,letterSpacing:1,marginTop:10}}>RESPIRAÇÃO</div>
                    <div style={{color:C.muted,fontSize:13,lineHeight:1.5,marginTop:3}}>{it.breath}</div>
                  </div>
                )}
              </div>
            );
          })}

          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:12,marginTop:4}}>
            {DICAS_TREINO.map((d,k)=><div key={k} style={{color:C.muted,fontSize:12,lineHeight:1.9}}>{d}</div>)}
          </div>
          </>
          )}
        </div>
        );
      })()}

      {/* DICAS */}
      {tab==="dicas"&&(
        <div style={{padding:"0 16px"}}>
          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,padding:"12px 14px",marginBottom:14}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>📅 Semana atual</div>
            <div style={{display:"flex",gap:6,justifyContent:"space-between"}}>
              {week.map((k,i)=>{
                const n=doneOn(k), isToday=k===today;
                return(
                  <div key={k} style={{flex:1,textAlign:"center"}}>
                    <div style={{width:"100%",aspectRatio:"1",borderRadius:6,background:n?C.green+"33":"#2a2d3a",border:`1.5px solid ${n?C.green:isToday?C.accent:C.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,marginBottom:4}}>
                      {n?<span style={{color:C.green}}>{n>1?`✓${n}`:"✓"}</span>:<span style={{color:C.dim,fontSize:10}}>—</span>}
                    </div>
                    <div style={{fontSize:9,color:isToday?C.accent:C.dim}}>{labels[i]}</div>
                  </div>
                );
              })}
            </div>
            <div style={{color:C.muted,fontSize:11,marginTop:8}}>{weekCount} {weekCount===1?"treino concluído":"treinos concluídos"} esta semana</div>
          </div>

          <div style={{background:`linear-gradient(135deg,${C.accent}22,${C.purple}11)`,border:`1px solid ${C.accent}44`,borderRadius:14,padding:16,marginBottom:14}}>
            <div style={{fontWeight:800,fontSize:16,marginBottom:6}}>🎯 Seu Objetivo</div>
            <div style={{color:C.muted,fontSize:13,lineHeight:1.7}}><strong style={{color:C.text}}>Déficit calórico moderado</strong> (~500 kcal/dia abaixo do gasto). Com treino de força + cardio estratégico, você pode perder <strong style={{color:C.accent}}>~1kg de gordura/semana</strong> enquanto preserva ou ganha músculo.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:12}}>
              {[{l:"Meta 90 dias",v:"−8 a −12kg gordura"},{l:"Frequência",v:"5x/semana musculação"},{l:"Cardio",v:"2–3x/semana"},{l:"Revisão",v:"A cada 4 semanas"}].map(s=>(
                <div key={s.l} style={{background:C.card,borderRadius:8,padding:"8px 10px",border:`1px solid ${C.border}`}}>
                  <div style={{color:C.dim,fontSize:10}}>{s.l}</div>
                  <div style={{fontWeight:700,fontSize:12,marginTop:2}}>{s.v}</div>
                </div>
              ))}
            </div>
          </div>

          {tips.map((tip,i)=>(
            <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:8,display:"flex",gap:12,alignItems:"flex-start"}}>
              <div style={{fontSize:22,flexShrink:0}}>{tip.icon}</div>
              <div>
                <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>{tip.title}</div>
                <div style={{color:C.muted,fontSize:12,lineHeight:1.6}}>{tip.text}</div>
              </div>
            </div>
          ))}

          <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:14,marginTop:4,marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:8,color:C.accent}}>⚠️ Consulte um profissional</div>
            <div style={{color:C.muted,fontSize:12,lineHeight:1.6}}>Este plano é um guia geral. Para resultados seguros e personalizados, consulte um <strong style={{color:C.text}}>nutrólogo ou nutricionista</strong> e um <strong style={{color:C.text}}>educador físico</strong>. Exames de sangue periódicos (a cada 6 meses) são recomendados.</div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
